server:
  port: 8005

spring:
  application:
    name: message-consumer
  config:
    import: nacos:message-consumer
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: dev
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        namespace: dev
        group: DEFAULT_GROUP
        file-extension: yml
  rabbitmq:
    host: 59.110.14.170
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 5
        max-concurrency: 10
        prefetch: 1
  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

# Feign配置
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
  circuitbreaker:
    enabled: true

# 断路器配置
resilience4j:
  circuitbreaker:
    instances:
      orderServiceCircuitBreaker:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
  timelimiter:
    instances:
      orderServiceCircuitBreaker:
        timeoutDuration: 10s

# 日志配置
logging:
  level:
    com.example.messageconsumer: DEBUG
    org.springframework.amqp.rabbit.listener: INFO
    org.springframework.cloud.openfeign: DEBUG