transport {
  # tcp, unix, unix-domain-socket
  type = "TCP"
  # NIO NATIVE
  server = "NIO"
  # enable heartbeat
  heartbeat = true
  # the client batch send request enable
  enableClientBatchSendRequest = true
  # thread factory for netty
  threadFactory {
    bossThreadPrefix = "NettyBoss"
    workerThreadPrefix = "NettyServerNIOWorker"
    serverExecutorThreadPrefix = "NettyServerBizHandler"
    shareBossWorker = false
    clientSelectorThreadPrefix = "NettyClientSelector"
    clientSelectorThreadSize = 1
    clientWorkerThreadPrefix = "NettyClientWorkerThread"
    # netty boss thread size, will not be used for UDS
    bossThreadSize = 1
    #auto default pin or 8
    workerThreadSize = "default"
  }
  shutdown {
    # when destroy server, wait seconds
    wait = 3
  }
  serialization = "seata"
  compressor = "none"
}

# service configuration
server {
  # recovery timeout
  recovery {
    #schedule committing retry period in milliseconds
    committingRetryPeriod = 1000
    #schedule asyn committing retry period in milliseconds
    asynCommittingRetryPeriod = 1000
    #schedule rollbacking retry period in milliseconds
    rollbackingRetryPeriod = 1000
    #schedule timeout retry period in milliseconds
    timeoutRetryPeriod = 1000
  }
  #transaction, lock, session
  session {
    # branch session size, if exceeded first try compress lockkey, still exceeded throws exceptions
    branchSessionSize = 16384
    # globe session size, if exceeded throws exceptions
    globeSessionSize = 512
    # file buffer size, if exceeded allocate new buffer
    fileWriteBufferCacheSize = 16384
    # session holding timeout
    sessionTimeout = 1800000
    # whether to use lock store
    enableBranchAsyncRemove = true
    # branch async remove batch size
    branchAsyncRemoveBatchSize = 16384
    # enable session serialization
    enableSerializeSession = true
  }
  # store mode: file, db, redis
  store {
    # store mode: file、db、redis
    mode = "file"
    
    # file store configuration
    file {
      # store location dir
      dir = "sessionStore"
      # branch session size , if exceeded first try compress lockkey, still exceeded throws exceptions
      maxBranchSessionSize = 16384
      # globe session size , if exceeded throws exceptions
      maxGlobalSessionSize = 512
      # file buffer size , if exceeded allocate new buffer
      fileWriteBufferCacheSize = 16384
      # when recover batch read size
      sessionReloadReadSize = 100
      # async, sync
      flushDiskMode = "async"
    }
    
    # database store configuration
    db {
      datasource = "druid"
      dbType = "mysql"
      driverClassName = "com.mysql.cj.jdbc.Driver"
      url = "jdbc:mysql://localhost:3306/seata?useUnicode=true&rewriteBatchedStatements=true"
      user = "root"
      password = "990324"
      minConn = 5
      maxConn = 100
      globalTable = "global_table"
      branchTable = "branch_table"
      lockTable = "lock_table"
      queryLimit = 100
      maxWait = 5000
    }
    
    # redis store configuration
    redis {
      host = "localhost"
      port = 6379
      password = ""
      database = 0
      minConn = 1
      maxConn = 10
      queryLimit = 100
    }
  }
  # metrics configuration
  metrics {
    enabled = false
    registryType = "compact"
    # multi exporters use comma divided
    exporterList = "prometheus"
    exporterPrometheusPort = 9898
  }
}

# client configuration
client {
  rm {
    # rm transaction timeout
    defaultBranchType = "AT"
    # 是否开启数据源代理
    enableAutoDataSourceProxy = true
    # 是否允许非XA数据源
    allowNonLocalBusiness = false
    # 上报超时回滚的分支事务
    reportRetryCount = 5
    # 自动刷新全局锁重试间隔(毫秒)
    tableMetaCheckEnable = true
    # 是否上报合并后的sql
    reportSuccessEnable = false
    # 表元数据获取方式
    sqlParserType = "druid"
    # 保存快照的最大行数
    snapshotThreshold = 100
    # 批量提交的最大行数
    batchCommitLockRetryInterval = 10
    # 批量提交的最大重试次数
    batchCommitLockRetryTimes = 3
    # 批量提交的最大行数
    batchCommitLockRetryPolicyBranchRollbackOnConflict = true
  }
  tm {
    # 默认全局事务超时时间（毫秒）
    defaultGlobalTransactionTimeout = 60000
    # 异步提交缓冲大小
    degradeCheck = false
    # 降级检查周期（毫秒）
    degradeCheckPeriod = 2000
    # 降级阈值
    degradeCheckAllowTimes = 10
    # 是否自动降级
    interceptorOrder = -2147482648
  }
  undo {
    # 表名
    dataValidation = true
    # 日志表的前缀
    logSerialization = "jackson"
    # 日志表的后缀
    onlyCareUpdateColumns = true
    # 是否检查数据有效性
    logTable = "undo_log"
  }
  log {
    # 日志级别
    exceptionRate = 100
  }
}

# 服务分组配置
service {
  # 事务组映射
  vgroupMapping.my_test_tx_group = "default"
  # 服务列表
  default.grouplist = "127.0.0.1:8091"
  # 是否降级
  enableDegrade = false
  # 禁用全局事务
  disableGlobalTransaction = false
}
