worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # Use absolute path to mime.types in nginx installation directory
    include       C:/app/nginx/nginx-1.27.5/conf/mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;
    
    # 前端应用配置
    server {
        listen       80;
        server_name  localhost;
        
        # 前端静态资源目录（指向构建后的前端文件）
        location / {
            root   d:/Cursor/TestJava/frontend/build;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;  # 支持React Router的路由模式
            add_header Cache-Control "no-cache";
        }
        
        # API代理配置 - 代理到API网关，由网关负责内部服务路由
        location /api {
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
        
        # 健康检查路径（可选）
        location /health {
            proxy_pass http://localhost:8080/actuator/health;
            proxy_set_header Host $host;
        }
        
        # 错误页面配置
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}